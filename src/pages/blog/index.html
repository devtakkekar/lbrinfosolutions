<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Practical guidance on enterprise storage, database, security, and AI infrastructure from the LBR InfoSolutions team.">
  <link rel="canonical" href="https://www.lbrinfosolutions.com/blog/">
  <meta property="og:title" content="Blog — LBR InfoSolutions">
  <meta property="og:description" content="Practical guidance on enterprise storage, database, security, and AI infrastructure.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.lbrinfosolutions.com/blog/">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260831" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260831" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260831" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260831" />

  <link rel="stylesheet" href="/src/styles/input.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <!-- The whole page — header and post list together — shares one
         continuous navy background with the same pattern/glow/glass
         treatment as the homepage hero, matching the reference design. -->
    <section class="relative bg-navy overflow-hidden">
      <!-- Subtle grid pattern background -->
      <div class="absolute inset-0 opacity-[0.03] pointer-events-none" aria-hidden="true" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%23ffffff&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>

      <!-- Ambient gradient glows — brand teal/blue/violet, identical to the homepage hero. -->
      <div class="absolute -top-40 -left-40 w-[560px] h-[560px] rounded-full bg-[#1ed3b0] opacity-[0.15] blur-[120px] pointer-events-none" aria-hidden="true"></div>
      <div class="absolute top-1/3 -right-32 w-[480px] h-[480px] rounded-full bg-[#6a5cf5] opacity-[0.14] blur-[120px] pointer-events-none" aria-hidden="true"></div>
      <div class="absolute -bottom-40 left-1/4 w-[420px] h-[420px] rounded-full bg-[#2f8ee0] opacity-[0.12] blur-[110px] pointer-events-none" aria-hidden="true"></div>

      <!-- Glass layer — frosted glassmorphism over the pattern + glows -->
      <div class="absolute inset-0 backdrop-blur-2xl bg-gradient-to-b from-white/[0.04] via-white/[0.015] to-transparent pointer-events-none" aria-hidden="true"></div>

      <div class="container-main relative z-10 py-16 md:py-20 lg:py-24">
        <div class="max-w-2xl mb-12 lg:mb-16 animate-on-scroll">
          <h1 class="text-h1 text-white mb-3">From the blog</h1>
          <p class="text-gray-400 leading-relaxed">Learn how to grow your business with our expert advice.</p>
        </div>

        <!-- Populated by blog-list.ts from src/data/blog.ts — add posts
             there, nothing here needs to change.

             data-post-count reserves height for this still-empty div
             (see #blog-list rule in blog.css) so the page doesn't jump
             from ~0 height to full height once JS renders the cards —
             that jump was the page's whole CLS problem. If you add or
             remove a post in blog.ts, bump this number to match
             blogPosts.length (a slightly-off estimate still helps a lot;
             it just doesn't fully vanish the (much smaller) shift the
             way an exact count does). -->
        <div id="blog-list" class="max-w-3xl" data-stagger data-post-count="3"></div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <!-- Reserves #blog-list's height BEFORE main.ts/the render script below
       run, so the container never paints at 0 height. Plain sync script
       (no type="module", no defer) so it executes immediately as the
       parser reaches it — before layout for this section happens — and
       doesn't need any build-time data, so it can't hit the asset-import
       problem described in vite-plugin-partials.ts. -->
  <script>
    (function () {
      var el = document.getElementById('blog-list');
      if (el) el.style.setProperty('--blog-post-count', el.dataset.postCount || '0');
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    import { renderBlogList } from '/src/components/blog-list.ts';
    import { initBlogGalleries } from '/src/components/blog-gallery.ts';
    import { blogPosts } from '/src/data/blog.ts';
    import { applyStagger, observeRevealElements } from '/src/scripts/animations.ts';
    import { initImageSkeletons } from '/src/components/image-skeleton.ts';

    function initBlog() {
      const listEl = document.getElementById('blog-list');
      if (!listEl) return;

      renderBlogList('blog-list', blogPosts);
      // Real content now determines height — drop the CSS reservation so
      // there's no leftover empty space if the estimate ran a bit high.
      listEl.style.removeProperty('--blog-post-count');
      applyStagger('#blog-list', '.blog-post');
      observeRevealElements(listEl);
      initBlogGalleries();
      // These <img> tags are inserted after main.ts's own page-wide scan
      // already ran, so they need their own scoped skeleton pass.
      initImageSkeletons(listEl);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBlog);
    } else {
      initBlog();
    }
  </script>
</body>
</html>
